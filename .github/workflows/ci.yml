name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.15'
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/prepare_package_cache.py
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync mypy
      - run: uv run --frozen --no-sync pytest
      - run: uv run --frozen --no-sync python scripts/package_acceptance.py
      - run: uv run --frozen --no-sync python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Minimum HTTPX compatibility
        run: uv pip install httpx==0.28.0
      - run: uv run --frozen --no-sync pytest
