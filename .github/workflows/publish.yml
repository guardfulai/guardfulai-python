name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted stable version
        required: true
      commit:
        description: Accepted full commit SHA
        required: true
      wheel_sha256:
        description: Locally accepted wheel SHA256
        required: true
      sdist_sha256:
        description: Locally accepted sdist SHA256
        required: true
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: read
      actions: read
    if: github.repository == 'guardfulai/guardfulai-python' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
      GH_TOKEN: ${{ github.token }}
      SDIST_SHA256: ${{ inputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.15'
      - run: python scripts/validate_release.py
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync python scripts/prepare_package_cache.py
      - run: make check package-check
      - run: python scripts/validate_release.py --artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guardfulai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
