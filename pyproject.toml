[project]
name = "guardfulai"
version = "0.1.1"
description = "Typed sync and async client for the Guardful AI REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Guardful AI"}]
dependencies = ["httpx>=0.28,<1", "tzdata; sys_platform == 'win32'"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.guardfulai.com"
Documentation = "https://www.guardfulai.com/docs/api/"
Repository = "https://github.com/guardfulai/guardfulai-python"
Issues = "https://github.com/guardfulai/guardfulai-python/issues"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pytest>=9,<10",
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
    "build>=1.2,<2",
    "twine>=6,<7",
    "packaging>=25",
    "pypi-attestations>=0.0.27,<1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardfulai"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/Makefile", "/src/guardfulai", "/tests", "/scripts", "/examples", "/docs", "/.gitignore", "/.gitattributes"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
